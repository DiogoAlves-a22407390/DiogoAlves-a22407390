{% extends 'portfolio/base.html' %}

{% block content %}
<h2>Login</h2>
<section>

    <!-- Login normal -->
    <article style="max-width:400px;">
        <header>
            <h3>Entrar com username e senha</h3>
        </header>
        <form method="post">
            {% csrf_token %}
            <div class="form-fields">
                <div class="form-group">
                    <label for="username">Utilizador</label>
                    <input type="text" name="username" id="username" placeholder="Nome de utilizador" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" name="password" id="password" placeholder="Senha" required>
                </div>
                {% if erro %}
                <p class="form-error">{{ erro }}</p>
                {% endif %}
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Entrar</button>
                <a href="{% url 'registo' %}" class="btn btn-secondary">Registar</a>
            </div>
        </form>
    </article>

    <!-- Magic Link -->
    <article style="max-width:400px;">
        <header>
            <h3>Entrar com link mágico</h3>
            <p>Insere o teu email e recebe um link de acesso direto, sem precisar de senha.</p>
        </header>
        <a href="{% url 'magic_link_request' %}" class="btn btn-primary">✉️ Enviar link mágico</a>
    </article>

</section>
{% endblock %}
