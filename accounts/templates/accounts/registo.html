{% extends 'portfolio/base.html' %}

{% block content %}
<h2>Registo</h2>
<section>
    <article style="max-width:400px;">
        <header>
            <h3>Criar conta</h3>
        </header>
        <form method="post">
            {% csrf_token %}
            <div class="form-fields">
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <p class="form-error">{{ field.errors|join:", " }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Registar</button>
                <a href="{% url 'login' %}" class="btn btn-secondary">Já tenho conta</a>
            </div>
        </form>
    </article>
</section>
{% endblock %}
